<div class="row">
  <input name="var_name" value="{{ item.name }}" placeholder="nome" aria-label="Nome variabile">
  <select name="var_type" aria-label="Tipo">
    {% for t in VARIABLE_TYPES %}
    <option value="{{ t }}" {% if item.type == t or (not item.type and t == 'String') %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>
  <input name="var_value" value="{{ item.value }}" placeholder="valore" aria-label="Valore">
  <button type="button" class="small secondary outline" onclick="this.closest('.row').remove()" aria-label="Rimuovi">✕</button>
</div>
