<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}knime-scheduler{% endblock %} · knime-scheduler</title>
  <link rel="stylesheet" href="{{ url_for('static', path='pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
  <script src="{{ url_for('static', path='htmx-sse.js') }}"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand"><strong>knime-scheduler</strong></a></li></ul>
      <ul>
        {% set section = request.url.path.split('/')[1] %}
        <li><a href="/schedules" {% if section == 'schedules' %}aria-current="page"{% endif %}>Schedule</a></li>
        <li><a href="/workflows" {% if section == 'workflows' %}aria-current="page"{% endif %}>Workflow</a></li>
        <li><a href="/environments" {% if section == 'environments' %}aria-current="page"{% endif %}>Environment</a></li>
        <li><a href="/runs" {% if section == 'runs' %}aria-current="page"{% endif %}>Run</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
