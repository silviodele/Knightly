[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knightly"
version = "0.1.0"
description = "Scheduler open source per workflow KNIME, ispirato a NodePit Runner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Silvio De Letteriis" }]
keywords = ["knime", "scheduler", "workflow", "automation", "batch"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
]

[project.urls]
Homepage = "https://github.com/silviodele/knightly"
Issues = "https://github.com/silviodele/knightly/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
knightly = "knightly.__main__:main"

[tool.setuptools.packages.find]
include = ["knightly*"]

[tool.setuptools.package-data]
knightly = ["webapp/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
