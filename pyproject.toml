[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knime-scheduler"
version = "0.1.0"
description = "Scheduler open source per workflow KNIME, ispirato a NodePit Runner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
knime-scheduler = "knime_scheduler.__main__:main"

[tool.setuptools.packages.find]
include = ["knime_scheduler*"]

[tool.setuptools.package-data]
knime_scheduler = ["webapp/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
